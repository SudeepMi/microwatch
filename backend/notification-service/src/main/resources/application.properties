server.port=8084
spring.application.name=notification-service

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:microwatch}
spring.datasource.username=${POSTGRES_USER:microwatch}
spring.datasource.password=${POSTGRES_PASSWORD:microwatch}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
