server.port=8081
spring.application.name=monitoring-service

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:microwatch}
spring.datasource.username=${POSTGRES_USER:microwatch}
spring.datasource.password=${POSTGRES_PASSWORD:microwatch}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

monitoring.interval.ms=${MONITORING_INTERVAL_MS:10000}
registry.service.url=${REGISTRY_URL:http://localhost:8082}
notification.service.url=${NOTIFICATION_URL:http://localhost:8084}
api.gateway.url=${API_GATEWAY_URL:http://localhost:8080}
